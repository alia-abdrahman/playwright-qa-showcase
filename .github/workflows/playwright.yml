name: Playwright Tests

# Run the whole suite automatically on every push and pull request to main.
# Tests execute on a clean cloud machine every time, with no manual steps, so a
# regression surfaces on the commit that introduced it rather than later.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets you trigger a run manually from the GitHub "Actions" tab too.
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright suite
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # Upload the HTML report so you can download and open it from the Actions run,
      # even (especially) when tests fail. This is your evidence artifact.
      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
